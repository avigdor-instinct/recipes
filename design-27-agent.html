<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 / Agent Surface</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Heebo,Arial,sans-serif}button{min-height:44px;font:inherit}.preview{min-height:100vh}.label{font-size:11px;font-weight:800;letter-spacing:.08em}.qty{font-weight:900}body{background:#080b12;color:#f4f6ff;overflow-x:hidden}.preview{background:radial-gradient(circle at 80% 15%,#4930ff55,transparent 32%),radial-gradient(circle at 10% 75%,#00e6c744,transparent 35%);padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#a695ff 20%,#4930ff 48%,#00e6c7 75%,transparent 76%);box-shadow:0 0 35px #6754ff}.hero{padding:64px 4px 26px}.hero h1{font:900 clamp(42px,10vw,74px)/.95 Rubik;margin:10px 0;letter-spacing:-.05em}.hero p{font-size:19px;color:#bec4d8;max-width:580px}.agent{background:#ffffff0c;border:1px solid #ffffff24;backdrop-filter:blur(20px);border-radius:28px;padding:20px;box-shadow:inset 0 1px #fff3}.agentline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}.pulse{width:12px;height:12px;border-radius:50%;background:#00e6c7;box-shadow:0 0 18px #00e6c7;margin-top:9px}.agent h2{margin:0;font-size:25px}.actions{display:flex;gap:8px;overflow:auto;margin-top:18px}.chip{white-space:nowrap;border:1px solid #ffffff28;background:#ffffff0b;color:#fff;border-radius:99px;padding:8px 13px}.chip.primary{background:#dfff4f;color:#121500;border:0}.composer{position:fixed;left:14px;right:14px;bottom:14px;border:1px solid #ffffff30;background:#111521ee;backdrop-filter:blur(24px);border-radius:22px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.composer span{color:#aeb5c8}.mic{background:#dfff4f;color:#151800;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;font-size:20px}</style></head><body><main class="preview"><header class="top"><div class="orb" aria-label="סוכן המטבח פעיל"></div><div class="label">KITCHEN AGENT · LIVE</div></header><section class="hero"><div class="label">18:27 · שני כלים פעילים</div><h1>מה קורה<br>במטבח?</h1><p>הסוכן הוא הממשק. שואלים, משנים, מצלמים ומבשלים בלי לנווט בתפריטים.</p></section><section class="agent"><div class="agentline"><i class="pulse"></i><div><div class="label">הסוכן שם לב</div><h2>הראגו מוכן. להוציא עכשיו?</h2><p>אם הילדים עוד לא בשולחן, אפשר להשאיר עוד 3 דקות בלי לפגוע במרקם.</p></div></div><div class="actions"><button class="chip primary">כן, הוצאתי</button><button class="chip">תן עוד 3 דקות</button><button class="chip">מה עם הפירה?</button></div></section><div class="composer"><span>דבר איתי תוך כדי בישול...</span><b class="mic">◉</b></div></main></body></html>
